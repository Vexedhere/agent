<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#09090b"><meta name="description" content="SparkAgent — one unified AI agent workspace."><title>SparkAgent</title>
<style>
:root{--bg:#09090b;--panel:#111113;--panel2:#17171a;--border:#27272a;--text:#f4f4f5;--muted:#a1a1aa;--accent:#8b5cf6;--accent2:#6366f1;--danger:#ef4444}*{box-sizing:border-box}html,body{height:100%;margin:0}body{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:radial-gradient(circle at 70% -10%,#241344 0,#09090b 36%);color:var(--text)}button,input{font:inherit}button{cursor:pointer}.app{height:100%;display:grid;grid-template-columns:260px 1fr;overflow:hidden}.sidebar{background:#0d0d0f;border-right:1px solid var(--border);padding:14px;display:flex;flex-direction:column;min-width:0}.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:19px;padding:10px}.logo{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,#a78bfa,#6366f1);display:grid;place-items:center;color:#fff;box-shadow:0 8px 30px #7c3aed44}.new{margin:10px 0 14px;border:1px solid #3f3f46;background:#18181b;color:#fff;border-radius:11px;padding:11px 13px;text-align:left}.new:hover{background:#202024}.search{width:100%;background:#141416;border:1px solid var(--border);color:#fff;border-radius:10px;padding:10px 12px;outline:none}.section-label{font-size:11px;color:#71717a;text-transform:uppercase;letter-spacing:.08em;margin:20px 8px 8px}.chats{overflow:auto;flex:1}.chat{display:flex;gap:8px;align-items:center;width:100%;border:0;background:transparent;color:#d4d4d8;text-align:left;padding:9px;border-radius:9px;margin:2px 0}.chat:hover,.chat.active{background:#1b1b1f}.chat span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.bottom{border-top:1px solid var(--border);padding-top:10px}.nav{display:block;color:#a1a1aa;text-decoration:none;padding:9px;border-radius:9px;font-size:14px}.nav:hover{background:#1b1b1f;color:#fff}.main{min-width:0;display:flex;flex-direction:column}.topbar{height:60px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 20px;background:#0b0b0dcf;backdrop-filter:blur(14px)}.model{font-size:13px;color:#d4d4d8;background:#151518;border:1px solid var(--border);border-radius:9px;padding:7px 10px}.profile{width:32px;height:32px;border-radius:50%;border:1px solid var(--border);background:#27272a;color:#fff}.conversation{flex:1;overflow:auto}.empty{min-height:100%;display:grid;place-items:center;padding:40px}.hero{text-align:center;max-width:720px}.hero h1{font-size:clamp(36px,6vw,62px);letter-spacing:-.045em;margin:0 0 12px}.gradient{background:linear-gradient(90deg,#fff,#c4b5fd 45%,#67e8f9);background-clip:text;color:transparent}.hero p{color:var(--muted);font-size:16px;line-height:1.6}.capabilities{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:24px}.chip{border:1px solid var(--border);background:#111113;color:#c4c4ca;border-radius:999px;padding:8px 11px;font-size:12px}.messages{max-width:880px;margin:auto;padding:28px 20px 140px}.message{display:flex;gap:14px;margin:24px 0}.avatar{width:30px;height:30px;border-radius:9px;flex:0 0 30px;display:grid;place-items:center;font-size:12px;font-weight:800;background:#27272a}.assistant .avatar{background:linear-gradient(135deg,#8b5cf6,#4f46e5)}.bubble{min-width:0;line-height:1.65;white-space:pre-wrap}.status{color:#a1a1aa;font-size:13px;margin:10px 0}.composer-wrap{position:fixed;bottom:0;left:260px;right:0;padding:20px;background:linear-gradient(transparent,#09090b 35%)}.composer{max-width:880px;margin:auto;border:1px solid #3f3f46;background:#151518;box-shadow:0 15px 50px #0008;border-radius:18px;padding:10px;display:flex;gap:8px;align-items:flex-end}.composer textarea{resize:none;flex:1;border:0;outline:0;background:transparent;color:#fff;padding:10px;min-height:44px;max-height:180px}.icon{border:0;background:transparent;color:#a1a1aa;border-radius:10px;padding:9px}.icon:hover{background:#27272a;color:#fff}.send{background:#fff;color:#09090b;border:0;border-radius:11px;padding:10px 14px;font-weight:750}.send:disabled{opacity:.4;cursor:not-allowed}.login{position:fixed;inset:0;background:#09090bf7;display:grid;place-items:center;z-index:5}.login-card{width:min(420px,calc(100% - 32px));background:#141416;border:1px solid var(--border);border-radius:20px;padding:28px;box-shadow:0 30px 100px #0009}.login-card h2{margin:0 0 8px}.login-card p{color:var(--muted);font-size:14px}.login-card a{display:block;text-align:center;background:#fff;color:#111;border-radius:10px;padding:12px;text-decoration:none;font-weight:700;margin-top:18px}.error{color:#fca5a5;background:#3f1515;border:1px solid #7f1d1d;padding:10px;border-radius:10px;font-size:13px;margin-top:12px}.mobile{display:none}@media(max-width:760px){.app{grid-template-columns:1fr}.sidebar{display:none}.composer-wrap{left:0}.mobile{display:block}.topbar{padding:0 12px}.messages{padding-left:14px;padding-right:14px}}
</style>
</head>
<body>
<div id="root"></div>
<script type="module">
import {createClient} from 'https://esm.sh/@supabase/supabase-js@2';
const SUPABASE_URL='https://nzaelikbjumaidaombmp.supabase.co';
const SUPABASE_ANON_KEY=window.SPARKAGENT_SUPABASE_ANON_KEY||'';
const API_BASE=window.SPARKAGENT_API_BASE||'';
const supabase=createClient(SUPABASE_URL,SUPABASE_ANON_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const state={user:null,chats:[],active:null,messages:[],busy:false};
const root=document.querySelector('#root');
const esc=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function render(){if(!state.user){root.innerHTML='<div class="login"><div class="login-card"><div class="logo">✦</div><h2>Welcome to SparkAgent</h2><p>Sign in through the SparkAgent authentication service to use your private agent workspace.</p><a href="https://try.sparkagent.in.net/?redirect='+encodeURIComponent(location.href)+'">Continue to SparkAgent Auth</a></div></div>';return}
root.innerHTML='<div class="app"><aside class="sidebar"><div class="brand"><div class="logo">✦</div>SparkAgent</div><button class="new" id="new">＋ New chat</button><input class="search" id="search" placeholder="Search chats…"><div class="section-label">Recent</div><div class="chats">'+state.chats.map(c=>'<button class="chat '+(c.id===state.active?'active':'')+'" data-id="'+c.id+'"><span>'+esc(c.title)+'</span></button>').join('')+'</div><div class="bottom"><a class="nav" href="#projects">▦ Projects</a><a class="nav" href="#connections">⌘ Connections</a><a class="nav" href="#settings">⚙ Settings</a><a class="nav" href="https://try.sparkagent.in.net">Account</a></div></aside><main class="main"><header class="topbar"><button class="icon mobile">☰</button><div class="model">SparkAgent · '+esc(window.SPARKAGENT_MODEL||'Configured model')+'</div><button class="profile">'+esc((state.user.email||'U')[0].toUpperCase())+'</button></header><section class="conversation" id="conversation">'+(state.messages.length?'<div class="messages">'+state.messages.map(m=>'<div class="message '+m.role+'"><div class="avatar">'+(m.role==='user'?'U':'✦')+'</div><div class="bubble">'+esc(m.content)+'</div></div>').join('')+(state.busy?'<div class="status">SparkAgent is working…</div>':'')+'</div>':'<div class="empty"><div class="hero"><h1>What can I <span class="gradient">help you build?</span></h1><p>One agent for coding, research, files, email and connected tools. SparkAgent only reports actions that actually happened.</p><div class="capabilities"><span class="chip">Code</span><span class="chip">Research</span><span class="chip">Files</span><span class="chip">Email</span><span class="chip">GitHub</span></div></div></div>')+'</section><div class="composer-wrap"><form class="composer" id="composer"><button type="button" class="icon">＋</button><textarea id="input" rows="1" placeholder="Message SparkAgent…"></textarea><button class="send" '+(state.busy?'disabled':'')+'>'+ (state.busy?'…':'Send')+'</button></form></div></main></div>';
root.querySelector('#new').onclick=newChat;root.querySelectorAll('.chat').forEach(b=>b.onclick=()=>openChat(b.dataset.id));root.querySelector('#composer').onsubmit=e=>{e.preventDefault();sendMessage()};const input=root.querySelector('#input');input.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage()}};}
async function authFetch(path,opts={}){const {data:{session}}=await supabase.auth.getSession();if(!session)throw Error('Session expired');return fetch(API_BASE+path,{...opts,headers:{...(opts.headers||{}),Authorization:'Bearer '+session.access_token,'Content-Type':'application/json'}})}
async function loadChats(){const r=await authFetch('/api/conversations');if(!r.ok)throw Error('Unable to load conversations');state.chats=await r.json();if(!state.active&&state.chats[0])await openChat(state.chats[0].id);else render()}
async function newChat(){const r=await authFetch('/api/conversations',{method:'POST',body:JSON.stringify({})});if(!r.ok)throw Error('Unable to create conversation');const c=await r.json();state.chats.unshift(c);state.active=c.id;state.messages=[];render()}
async function openChat(id){state.active=id;const r=await authFetch('/api/conversations/'+id+'/messages');if(!r.ok)throw Error('Unable to load messages');state.messages=await r.json();render();setTimeout(()=>document.querySelector('#input')?.focus(),0)}
async function sendMessage(){if(state.busy)return;const input=document.querySelector('#input');const text=input.value.trim();if(!text)return;if(!state.active)await newChat();state.messages.push({role:'user',content:text});input.value='';state.busy=true;render();const r=await authFetch('/api/agent/run',{method:'POST',body:JSON.stringify({conversationId:state.active,message:text})});if(!r.ok){state.messages.push({role:'assistant',content:'The agent request could not be started.'});state.busy=false;render();return}const reader=r.body.getReader(),decoder=new TextDecoder();let buffer='',answer='';state.messages.push({role:'assistant',content:''});render();while(true){const {value,done}=await reader.read();if(done)break;buffer+=decoder.decode(value,{stream:true});const chunks=buffer.split('\n\n');buffer=chunks.pop()||'';for(const chunk of chunks){const line=chunk.split('\n').find(x=>x.startsWith('data: '));if(!line)continue;try{const e=JSON.parse(line.slice(6));if(e.type==='delta'){answer+=e.text||'';state.messages[state.messages.length-1].content=answer;render()}else if(e.type==='status'){state.status=e.text;render()}else if(e.type==='error'){state.messages[state.messages.length-1].content=e.text||'The AI request failed.';render()}}catch{}}}state.busy=false;loadChats().catch(()=>render())}
supabase.auth.onAuthStateChange((_event,session)=>{state.user=session?.user||null;state.chats=[];state.messages=[];state.active=null;if(state.user)loadChats().catch(()=>render());else render()});
const initial=await supabase.auth.getSession();state.user=initial.data.session?.user||null;if(state.user)loadChats().catch(()=>render());else render();
</script>
</body></html>
